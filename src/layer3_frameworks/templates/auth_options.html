{% extends "layout.html" %}

{% block title %}Choose Authentication Method{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow">
                <div class="card-header text-center">
                    <h3 class="mb-0">Welcome to Missiora</h3>
                    <p class="text-muted">Sign in to get started</p>
                </div>
                <div class="card-body p-5">
                    <!-- GitHub Auth Option -->
                    <div class="auth-option mb-3">
                        <a href="{{ url_for('github_auth') }}" class="btn btn-dark btn-lg w-100 py-3">
                            <i class="fab fa-github me-2"></i>
                            Continue with GitHub
                        </a>
                    </div>

                    <!-- Google Auth Option -->
                    <div class="auth-option mb-3">
                        <a href="{{ url_for('google_auth') }}" class="btn btn-danger btn-lg w-100 py-3">
                            <i class="fab fa-google me-2"></i>
                            Continue with Google
                        </a>
                    </div>

                    <!-- Apple ID Option -->
                    <div class="auth-option mb-4">
                        <a href="{{ url_for('apple_auth') }}" class="btn btn-secondary btn-lg w-100 py-3 apple-btn">
                            <i class="fab fa-apple me-2"></i>
                            Continue with Apple
                        </a>
                    </div>

                    <!-- MetaMask Option - Commented out for now -->
                    <!--
                    <div class="divider my-4">
                        <span class="text-muted">or</span>
                    </div>

                    <div class="auth-option">
                        <a href="{{ url_for('metamask_login_page') }}" class="btn btn-warning btn-lg w-100 py-3 metamask-btn">
                            <i class="fab fa-ethereum me-2"></i>
                            Connect with MetaMask
                        </a>
                        <div class="mt-3">
                            <h6 class="fw-bold">Web3 Ready</h6>
                            <ul class="list-unstyled text-muted small">
                                <li><i class="fas fa-check text-success me-2"></i>Blockchain authentication</li>
                                <li><i class="fas fa-check text-success me-2"></i>Control your digital identity</li>
                                <li><i class="fas fa-check text-success me-2"></i>Future Web3 features</li>
                            </ul>
                        </div>
                    </div>
                    -->

                    <div class="text-center mt-4">
                        <p class="text-muted small">
                            New to AI for solopreneurs? 
                            <a href="{{ url_for('narrative_chat') }}" class="text-decoration-none">Try our chat first</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.divider {
    position: relative;
    text-align: center;
}

.divider:before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 1px;
    background: #dee2e6;
}

.divider span {
    background: #fff;
    padding: 0 1rem;
}

.auth-option {
    transition: transform 0.2s ease;
}

.auth-option:hover {
    transform: translateY(-2px);
}

.btn-dark:hover {
    background-color: #1a1a1a !important;
    transform: translateY(-1px);
}

.btn-danger:hover {
    background-color: #dc2626 !important;
    transform: translateY(-1px);
}

.apple-btn {
    background-color: #000 !important;
    color: white !important;
}

.apple-btn:hover {
    background-color: #1a1a1a !important;
    color: white !important;
    transform: translateY(-1px);
}
</style>
{% endblock %}
