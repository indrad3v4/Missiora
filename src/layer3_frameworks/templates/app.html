<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missiora - AI Agency for Solopreneurs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            min-height: 100vh;
        }

        .auth-required {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 3rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 1rem;
            letter-spacing: 0.1em;
        }

        .auth-message {
            color: #4a5568;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .auth-button {
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
            margin: 0.5rem;
        }

        .auth-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }

        .guest-button {
            background: #6b7280;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
            margin: 0.5rem;
        }

        .guest-button:hover {
            background: #374151;
        }
    </style>
</head>
<body>
    {% if current_user.is_authenticated %}
        <!-- Include the full app interface -->
        {% include 'index.html' %}
    {% else %}
        <div class="auth-required">
            <div class="auth-card">
                <div class="logo">MISSIORA</div>
                <div class="auth-message">
                    Sign in to access your personalized AI agency experience with Identity, Mission, and Roadmap orchestrators.
                </div>
                <a href="{{ url_for('replit_auth.login') }}" class="auth-button">
                    Sign in with Replit
                </a>
                <br>
                <a href="/app?guest=true" class="guest-button">
                    Continue as Guest
                </a>
            </div>
        </div>
    {% endif %}
</body>
</html>
