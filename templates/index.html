<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MISSIORA - Mixed Reality AI Companion with Vision</title>
    <link rel="stylesheet" href="/static/css/mr-styles.css">
    <style>
        /* Ensure full viewport coverage */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        /* Loading state */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            font-weight: 600;
            z-index: 20;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">Loading Missiora Vision...</div>
    </div>
    
    <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js"
      }
    }
    </script>
    <script type="module">
        import { createApp } from 'vue'
        import { MainApp } from '/static/js/vue-components.js'
        
        // Initialize app with error handling
        try {
            const app = createApp(MainApp);
            app.mount('#app');
            console.log('✓ Missiora Vision loaded successfully');
        } catch (error) {
            console.error('App mount failed:', error);
            document.querySelector('.loading').textContent = 'Loading failed. Refreshing...';
            setTimeout(() => window.location.reload(), 2000);
        }
    </script>
</body>
</html>
