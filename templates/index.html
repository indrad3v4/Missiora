<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missiora - AI Agency for Solopreneurs</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f9fafb;
            line-height: 1.5;
        }
        
        #app {
            min-height: 100vh;
        }
        
        /* Loading state */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 1.2rem;
            color: #6b7280;
        }

        /* Main App Styles */
        .main-app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f9fafb;
        }

        .content-area {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        /* Enhanced Header Styles */
        .gradient-header {
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            padding: 1rem 2rem;
            color: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .max-w-7xl {
            max-width: 80rem;
        }

        .mx-auto {
            margin-left: auto;
            margin-right: auto;
        }

        .flex {
            display: flex;
        }

        .justify-between {
            justify-content: space-between;
        }

        .items-center {
            align-items: center;
        }

        .text-2xl {
            font-size: 1.5rem;
            line-height: 2rem;
        }

        .font-bold {
            font-weight: 700;
        }

        .tracking-wider {
            letter-spacing: 0.05em;
        }

        .glass-pill {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 1.5rem;
            padding: 0.75rem 1.5rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .user-data-items {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .avatar-circle {
            width: 3rem;
            height: 3rem;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.125rem;
            border: 2px solid rgba(255,255,255,0.3);
        }

        /* Footer Navigation */
        .footer-nav {
            background: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
            border-top: 1px solid #e5e7eb;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            position: sticky;
            bottom: 0;
        }

        .nav-btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: #f3f4f6;
            color: #6b7280;
            min-width: 120px;
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #4ade80 0%, #22d3ee 100%);
            color: white;
            transform: translateY(-2px);
        }

        .nav-btn:hover:not(.active) {
            background: #e5e7eb;
            transform: translateY(-1px);
        }

        /* Enhanced Content Card Styles */
        .glass-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .content-card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin: 2rem auto;
            max-width: 800px;
        }

        .max-w-4xl {
            max-width: 56rem;
        }

        .px-6 {
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }

        .py-8 {
            padding-top: 2rem;
            padding-bottom: 2rem;
        }

        .p-8 {
            padding: 2rem;
        }

        .text-3xl {
            font-size: 1.875rem;
            line-height: 2.25rem;
        }

        .text-gray-800 {
            color: #1f2937;
        }

        .text-gray-600 {
            color: #4b5563;
        }

        .mb-2 {
            margin-bottom: 0.5rem;
        }

        .mb-8 {
            margin-bottom: 2rem;
        }

        .space-y-6 > * + * {
            margin-top: 1.5rem;
        }

        /* Orchestrator Styles */
        .orchestrator-card {
            background: linear-gradient(135deg, #eff6ff 0%, #f0f9ff 100%);
            border: 2px solid #dbeafe;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.1);
        }

        .orchestrator-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #dbeafe;
        }

        .orchestrator-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: #1e40af;
            margin: 0;
        }

        .close-orchestrator {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #6b7280;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .close-orchestrator:hover {
            color: #374151;
        }

        .orchestrator-messages {
            max-height: 20rem;
            overflow-y: auto;
            margin-bottom: 1rem;
            padding-right: 0.5rem;
        }

        .message-bubble {
            margin-bottom: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            animation: fadeInUp 0.3s ease-out;
        }

        .user-message {
            background: #dbeafe;
            margin-left: 2rem;
            border-bottom-right-radius: 0.25rem;
        }

        .ai-message {
            background: white;
            margin-right: 2rem;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 0.25rem;
        }

        .message-content {
            line-height: 1.5;
            color: #374151;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #6b7280;
            font-style: italic;
        }

        .typing-dots {
            display: flex;
            gap: 0.25rem;
        }

        .typing-dots span {
            width: 0.375rem;
            height: 0.375rem;
            background: #9ca3af;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }

        .orchestrator-input {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .orchestrator-input .flex-1 {
            flex: 1;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        /* Enhanced Form Styles */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-weight: 600;
            color: #374151;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .input-field {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.75rem;
            font-size: 1rem;
            transition: all 0.2s ease;
            background: white;
        }

        .input-field:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
            transform: translateY(-1px);
        }

        .textarea-field {
            min-height: 6rem;
            resize: vertical;
            font-family: inherit;
        }

        .gap-4 {
            gap: 1rem;
        }

        .pt-4 {
            padding-top: 1rem;
        }

        .flex-1 {
            flex: 1;
        }

        /* Enhanced Button Styles */
        .btn-primary {
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            color: white;
            padding: 0.875rem 1.75rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
            padding: 0.875rem 1.75rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: #374151;
            transform: translateY(-1px);
        }

        .save-btn, .chat-btn, .complete-btn, .activate-btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .save-btn {
            background: linear-gradient(135deg, #4ade80 0%, #22d3ee 100%);
            color: white;
        }

        .chat-btn {
            background: #6b7280;
            color: white;
        }

        .complete-btn {
            background: #22c55e;
            color: white;
        }

        .activate-btn {
            background: #3b82f6;
            color: white;
        }

        .save-btn:hover, .chat-btn:hover, .complete-btn:hover, .activate-btn:hover {
            transform: translateY(-2px);
        }

        .button-group {
            display: flex;
            gap: 1rem;
        }

        /* Chat Styles */
        .orchestrator-chat {
            margin-bottom: 2rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
        }

        .chat-header {
            background: #f3f4f6;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
        }

        .chat-header h3 {
            margin: 0;
            color: #374151;
        }

        .close-chat {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #6b7280;
        }

        .chat-messages {
            max-height: 300px;
            overflow-y: auto;
            padding: 1rem;
        }

        .message {
            margin-bottom: 1rem;
            padding: 0.75rem;
            border-radius: 8px;
        }

        .message.user {
            background: #dbeafe;
            margin-left: 2rem;
        }

        .message.agent {
            background: #f3f4f6;
            margin-right: 2rem;
        }

        .chat-input {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
            border-top: 1px solid #e5e7eb;
        }

        .chat-input input {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
        }

        .chat-input button {
            padding: 0.75rem 1.5rem;
            background: #4ade80;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .chat-input button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        /* Roadmap Styles */
        .subtitle {
            color: #6b7280;
            margin-bottom: 2rem;
        }

        .milestone-track {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .milestone-node {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            padding: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .milestone-node:hover {
            background: #f9fafb;
        }

        .milestone-node.active {
            background: #dbeafe;
            border-color: #3b82f6;
        }

        .milestone-node.completed {
            background: #dcfce7;
            border-color: #22c55e;
        }

        .milestone-node.upcoming {
            background: #f3f4f6;
        }

        .milestone-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .milestone-node.active .milestone-icon {
            background: #3b82f6;
            color: white;
        }

        .milestone-node.completed .milestone-icon {
            background: #22c55e;
            color: white;
        }

        .milestone-node.upcoming .milestone-icon {
            background: #9ca3af;
            color: white;
        }

        .milestone-content {
            flex: 1;
        }

        .milestone-content h3 {
            margin: 0 0 0.5rem 0;
            color: #111827;
        }

        .milestone-content p {
            margin: 0;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .suggestions {
            margin-top: 1rem;
            padding: 1rem;
            background: #fef3c7;
            border-radius: 8px;
        }

        .suggestions h4 {
            margin: 0 0 0.5rem 0;
            color: #92400e;
            font-size: 0.9rem;
        }

        .suggestion-details {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: #92400e;
        }

        .milestone-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .info-pill {
                flex-direction: column;
                gap: 0.5rem;
                align-items: center;
            }
            
            .info-pill span {
                font-size: 0.8rem;
            }
            
            .brand {
                font-size: 1.2rem;
            }
            
            .footer-nav {
                padding: 0.75rem 1rem;
                gap: 0.5rem;
            }
            
            .nav-btn {
                padding: 0.75rem 1rem;
                font-size: 0.9rem;
                min-width: 100px;
            }
            
            .content-card {
                margin: 1rem;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">Loading Missiora...</div>
    </div>
    
    <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
      }
    }
    </script>
    <script type="module">
        import { createApp } from 'vue'
        import { MainApp } from '/static/js/vue-components.js'
        
        const app = createApp(MainApp)
        
        app.config.errorHandler = (err, vm, info) => {
            console.error('Vue error:', err, info)
        }
        
        app.mount('#app')
    </script>
</body>
</html>
